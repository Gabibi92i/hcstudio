const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cl=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,k)=>a+(b-a)*k;

const TAGS=[[-9,'SAUT N°1'],[T.s2,'JOHNSTON & THOMAS'],[T.s3,'SAUT N°2'],[T.s4,"L'ŒIL SUIT L'ARC"],[T.s5,'SQUASH & STRETCH']];

// ---------- Point (rond, yeux seulement, membres au trait) ----------
function eyesSVG(e,col,ink,look,ox,oy,sq,bk){const [lx,ly]=look||[0,0];const E=[[-34+ox,-12+oy],[34+ox,-12+oy]];let s='';
 const pup=(x,y,r=12,dx=lx,dy=ly)=>`<circle cx="${x+dx*8}" cy="${y+dy*8}" r="${r}" fill="${col}"/><circle cx="${x+dx*8-r*.38}" cy="${y+dy*8-r*.38}" r="${r*.3}" fill="${ink}"/>`;
 const ell=(x,y,rx=23,ry=28)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry*(1-Math.max(0,sq)*.6)}" fill="${ink}"/>`;
 const brow=(x1,y1,x2,y2)=>`<path d="M${x1+ox} ${y1+oy} L${x2+ox} ${y2+oy}" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`;
 const lid=(x,y,k)=>`<rect x="${x-25}" y="${y-31}" width="50" height="${62*k}" fill="${col}"/>`;
 if(bk>.92)return E.map(([x,y])=>`<path d="M${x-18} ${y} L${x+18} ${y}" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`).join('');
 switch(e){
  case 'content': return E.map(([x,y])=>`<path d="M${x-17} ${y+6} Q${x} ${y-20} ${x+17} ${y+6}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`).join('');
  case 'surpris': s=E.map(([x,y])=>ell(x,y-3,24,31)+pup(x,y-3,8,lx*.5,ly*.5)).join('')+brow(-50,-62,-20,-66)+brow(20,-66,50,-62);break;
  case 'concentre': s=E.map(([x,y])=>ell(x,y)+pup(x,y+4,11)+lid(x,y,.38)).join('')+brow(-52,-50,-18,-52)+brow(18,-52,52,-50);break;
  case 'ennuye': s=E.map(([x,y])=>ell(x,y)+pup(x,y+10,11,lx,0)+lid(x,y,.55)).join('')+brow(-52,-34,-18,-34)+brow(18,-34,52,-34);break;
  default: s=E.map(([x,y])=>ell(x,y)+pup(x,y)).join('');
 }
 if(bk>0)s+=E.map(([x,y])=>`<rect x="${x-26}" y="${y-33}" width="52" height="${66*bk}" fill="${col}"/>`).join('');
 return s;}
// corps : L = largeur, H = 1/L (surface constante), pieds toujours à y=155
function bodyGeo(sq,low){const L=1+sq,rx=100*L,ry=100/L,cy=100+low-ry;return {L,rx,ry,cy};}
function chr(o){const col=o.col,ink=o.ink,sq=o.sq||0,low=o.low||0,tuck=o.tuck||0,tn=o.turn||0,G=bodyGeo(sq,low);
 const L=d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${o.limbs??1}"/>`;
 let s='';
 [-1,1].forEach(sd=>{const hy=94+low,fy=155-tuck,kx=sd*(29+low*1.15+tuck*.5),ky=(hy+fy)/2;
  s+=L(`M${sd*28} ${hy} Q${kx} ${ky} ${sd*30} ${fy} L${sd*46} ${fy}`);});
 const th=(20+140*(o.arm||0))*Math.PI/180;
 [-1,1].forEach(sd=>{const sx=sd*G.rx*.9,sy=G.cy+30/G.L,ex_=sx+sd*64*Math.sin(th),ey_=sy+64*Math.cos(th);
  const mx=(sx+ex_)/2+sd*12*Math.cos(th),my=(sy+ey_)/2-12*Math.sin(th)*.3;s+=L(`M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex_.toFixed(1)} ${ey_.toFixed(1)}`);});
 s+=`<ellipse cx="0" cy="${G.cy.toFixed(2)}" rx="${G.rx.toFixed(2)}" ry="${G.ry.toFixed(2)}" fill="${col}"/>`;
 const oy=G.cy-12/G.L+12;
 const gk=o.glyphK||0;const gl=gk>0?`<text x="104" y="${-70+low}" transform="translate(130 -120) scale(${lerp(.86,1,gk)}) translate(-130 120)" opacity="${gk}" style="font:700 110px BG;font-stretch:80%" fill="${col}">${o.glyph}</text>`:'';
 return s+`<g opacity="${o.eyes??1}">${eyesSVG(o.e||'neutre',col,ink,o.look,tn*20,oy,sq,o.blink||0)}</g>`+gl;}
// ---------- caméra 3D du décor (sol) ----------
let CAM={};
function camAt(t){const k=sine(P(t,0,16));return {p:(21+1.2*k)*Math.PI/180,D:1500-40*k,f:1300,cx:540,cy:1040,yaw:.016*Math.sin(2*Math.PI*t/13)};}
function pr(X,Y,Z){const c=CAM,cy_=Math.cos(c.yaw),sy=Math.sin(c.yaw);const x=X*cy_-Z*sy,z=X*sy+Z*cy_;
 const cp=Math.cos(c.p),sp=Math.sin(c.p);const py=Y-c.D*sp,pz=z+c.D*cp;const yu=py*cp+pz*sp,zf=-py*sp+pz*cp;const s=c.f/zf;return [c.cx+x*s,c.cy-yu*s,s,zf];}
// ---------- texte : apparition mot à mot ----------

 const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/( )/).forEach(p=>{if(p==' '){f.append(' ');return}if(!p)return;const s=document.createElement('span');s.className='wd';s.textContent=p;f.append(s);W.push([s,a+0.075*i++,el]);});c.replaceWith(f);}else walk(c);});};walk(el);});
const LABS=$$('.lab').map(e=>[e,+e.dataset.r]);const X=$$('[data-x]').map(e=>[e,+e.dataset.x,+(e.dataset.r||0)]);
// ---------- vie : clignements ----------

// ---------- sol ----------
const fl=$('#floor').getContext('2d'),mo=$('#motes').getContext('2d');
const MOTES=[];for(let i=0;i<34;i++)MOTES.push([lerp(-800,800,rnd()),lerp(20,520,rnd()),lerp(-700,1300,rnd()),rnd()]);
function drawFloor(t,alpha){fl.clearRect(0,0,1080,1920);if(alpha<=0)return;fl.globalAlpha=alpha;
 const Z0=300,l=pr(-650,0,Z0),r=pr(650,0,Z0),n=pr(0,0,Z0-650),f=pr(0,0,Z0+650);
 const rx=(r[0]-l[0])/2,ry=Math.max(4,(n[1]-f[1])/2),mx=(l[0]+r[0])/2,my=(n[1]+f[1])/2;
 fl.save();fl.translate(mx,my);fl.scale(1,ry/rx);const g=fl.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(255,232,238,.10)');g.addColorStop(1,'rgba(255,232,238,0)');fl.fillStyle=g;fl.beginPath();fl.arc(0,0,rx,0,7);fl.fill();fl.restore();
 const s0=pr(-420,0,120),s1=pr(420,0,120),s2=pr(0,0,40),s3=pr(0,0,200);
 fl.save();fl.translate((s0[0]+s1[0])/2,(s2[1]+s3[1])/2);fl.scale(1,Math.max(.05,(s2[1]-s3[1])/(s1[0]-s0[0])));const sg=fl.createRadialGradient(0,0,0,0,0,(s1[0]-s0[0])/2);sg.addColorStop(0,'rgba(30,3,9,.30)');sg.addColorStop(1,'rgba(30,3,9,0)');fl.fillStyle=sg;fl.beginPath();fl.arc(0,0,(s1[0]-s0[0])/2,0,7);fl.fill();fl.restore();
 fl.fillStyle='#F7F3F1';
 for(let X=-975;X<=975;X+=75)for(let Z=-750;Z<=1950;Z+=75){const p=pr(X,0,Z);if(p[3]<80)continue;
  const fog=cl(1-(Z+200)/2150)*cl(1-Math.abs(X)/1050),a=.20*fog*fog;if(a<.01)continue;fl.globalAlpha=alpha*a;fl.beginPath();fl.arc(p[0],p[1],Math.max(.8,2.4*p[2]),0,7);fl.fill();}
 fl.globalAlpha=1;}
function drawMotes(t,alpha){mo.clearRect(0,0,1080,1920);if(alpha<=0)return;
 MOTES.forEach(([x,y,z,r],i)=>{const yy=y+((t*14*(.5+r))%500),xx=x+Math.sin(t*.3+i)*30;const p=pr(xx,(yy%540)+10,z);if(p[3]<60)return;
  const rad=(1.2+3.5*r)*p[2]*1.4,a=alpha*(.10+.16*r)*cl(1-Math.abs(p[1]-900)/1100);
  const g=mo.createRadialGradient(p[0],p[1],0,p[0],p[1],rad*2.2);g.addColorStop(0,`rgba(247,243,241,${a})`);g.addColorStop(1,'rgba(247,243,241,0)');mo.fillStyle=g;mo.beginPath();mo.arc(p[0],p[1],rad*2.2,0,7);mo.fill();});}
// ---------- mécanique du saut ----------
// accroupi (anticipation) : 0 → 1
function crouchAt(t){if(t<T.crouch)return 0;if(t<T.crouch+.7)return .72*io(P(t,T.crouch,.7));if(t<T.j2-.1)return .72+.28*sine(P(t,T.crouch+.7,T.j2-.1-T.crouch-.7));return 1-cl(P(t,T.j2-.1,.1));}
function poseAt(t){
 const br=Math.sin(t*2.1)*.012;let x,yUp=0,sq=0,low=0,arm=.1,tuck=0,rot=0,dir=1;
 let J0=J[0],J1=J[1];
 if(t<J0.t0+J0.d){const u=cl(P(t,J0.t0,J0.d));x=lerp(J0.a,J0.b,u);yUp=4*HJ*u*(1-u);dir=1;}
 else if(t<J1.t0-.1){x=XB;const c=crouchAt(t);sq=.24*c;low=30*c;arm=lerp(.1,.02,c);dir=t<T.turn?1:-1;}
 else if(t<J1.t0){x=XB;const k=io(P(t,J1.t0-.1,.1));sq=lerp(.24,-.26,k);low=30*(1-k);arm=lerp(.02,.95,k);dir=-1;}
 else if(t<J1.t0+J1.d){const u=cl(P(t,J1.t0,J1.d));x=lerp(J1.a,J1.b,u);yUp=4*HJ*u*(1-u);dir=-1;
  sq=-.26*Math.exp(-u*5)-.13*sine(P(u,.62,.38));arm=lerp(.95,.4,u);tuck=18*Math.sin(Math.PI*u);rot=-11*Math.sin(Math.PI*u);}
 else{x=XA;dir=-1;const d=t-T.land2;
  const sp=.36*Math.exp(-d/.18)*Math.cos(2*Math.PI*d/.46);sq=lerp(-.13,sp,cl(d/.05));low=Math.max(0,sq)/.36*30;arm=lerp(.4,.1,sine(P(d,0,.5)));}
 return {x,yUp,sq:sq+(yUp>0?0:br),low,arm,tuck,rot,dir};}
// ---------- état de Point (expression, regard) ----------
function pointAt(t){const p=poseAt(t);let e='neutre',look=[p.dir,0],o={};
 if(t<T.oh){e='neutre';look=[1,0];}
 else if(t<T.pfff){e='surpris';look=[.4,-.1];o.glyph='!';o.glyphK=1-sine(P(t,1.7,.3));p.sq+=-.05*Math.sin(Math.PI*cl(P(t,T.oh,.25)));}
 else if(t<T.s2){e='ennuye';look=[-.8,.5];p.sq+=.03*Math.sin(Math.PI*cl(P(t,T.pfff,.4)));}
 else if(t<T.hm){e='neutre';look=[-.8,.7];}
 else if(t<T.s3){e='concentre';look=[-.7,.6];}
 else if(t<T.crouch){e='neutre';look=t<T.turn?[.2,.4]:[-1,.1];}
 else if(t<T.j2){e='concentre';look=[-1,.35];}
 else if(t<T.land2){e='neutre';look=[-1,lerp(-.2,.6,P(t,T.j2,JD))];}
 else if(t<T.tadam){e='neutre';look=[-.6,.3];}
 else if(t<T.s5){e=t<T.s5-.3?'content':'neutre';look=[.2,-.3];p.arm=Math.max(p.arm,1.0*Math.sin(Math.PI*cl(P(t,T.tadam,.9))));p.sq+=.06*Math.sin(Math.PI*cl(P(t,T.tadam,.3)));}
 else if(t<T.s5+2.2){e='neutre';look=[1,-.5];}
 else if(t<T.end-.4){e='neutre';look=[.6,.8];}
 else {e='content';look=[.2,-.3];}
 return Object.assign(p,{e,look,turn:.25*Math.sign(look[0])},o);}
// ---------- carte ----------
const rgba=a=>`rgba(92,15,30,${a.toFixed(3)})`;
const FEET=BASE;  // y des pieds sur la carte
function ghost(pp,a,hl){const G=bodyGeo(pp.sq,pp.low);const cx=pp.x,cy=FEET-pp.yUp+(G.cy-155)*PS;
 return `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(G.rx*PS).toFixed(1)}" ry="${(G.ry*PS).toFixed(1)}" transform="rotate(${pp.rot.toFixed(2)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${rgba((hl?.13:.07)*a)}" stroke="${rgba((hl?.55:.17)*a)}" stroke-width="${hl?3:2}"/>`;}
function swapText(list,t,fn){let ci=0;list.forEach((c,j)=>{if(t>=c[0])ci=j});let g='';
 list.forEach((c,j)=>{const a=j==ci?(j?sine(P(t,c[0]+.3,.45)):1):(j==ci-1?1-sine(P(t,list[ci][0],.35)):0);if(a<=0.001)return;g+=fn(c[1],a);});return g;}
const SEG=[[200,388,'ANTICIPATION'],[396,560,'ACTION'],[568,724,'RÉCEPTION']];

 g+=swapText(TAGS,t,(s,a)=>`<text x="724" y="68" text-anchor="end" style="font:500 25px GM;letter-spacing:.06em" fill="${BX}" opacity="${(a*.75).toFixed(3)}">${s.replace('&','&amp;')}</text>`);
 // sol, obstacle

 // arc prévu (le regard sait où il va atterrir)

 if(ak>0){const um=io(P(t,T.arc,.6));let d='';const n=Math.max(1,Math.round(60*um));for(let i=0;i<=n;i++){const u=um*i/n;d+=(i?'L':'M')+lerp(XB,XA,u).toFixed(1)+' '+(FEET-78-4*HJ*u*(1-u)).toFixed(1);}
  g+=`<path d="${d}" fill="none" stroke="${BX}" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity="${(.55*(1-sine(P(t,T.s5,.5)))).toFixed(3)}"/>`;
