 const lid=(x,y,k)=>`<rect x="${x-25}" y="${y-31}" width="50" height="${62*k}" fill="${col}"/>`;
 if(e=='plisse'){ // il plisse les yeux : > <
  const [[x1,y1],[x2,y2]]=E;return `<path d="M${x1-15} ${y1-15}L${x1+13} ${y1}L${x1-15} ${y1+15}M${x2+15} ${y2-15}L${x2-13} ${y2}L${x2+15} ${y2+15}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`+brow(-54,-40,-20,-34)+brow(20,-34,54,-40);}

  default: s=E.map(([x,y])=>ell(x,y)+pup(x,y)).join('');

 const body=`<ellipse cx="0" cy="${100*sq}" rx="${100*(1+sq)}" ry="${100*(1-sq)}" fill="${col}"/>`;
 const ey=G.ey+12+100*sq;
 const gk=o.glyphK||0;const gx=o.gx??104,gy=o.gy??-70;const gl=gk>0?`<text x="${gx}" y="${gy}" transform="translate(${gx+26} ${gy-50}) scale(${lerp(.86,1,gk)}) translate(${-gx-26} ${50-gy})" opacity="${gk}" style="font:700 110px BG;font-stretch:80%" fill="${col}">${o.glyph}</text>`:'';
 return s+body+`<g opacity="${o.eyes??1}">${eyesSVG(o.e||'neutre',col,ink,o.look,tn*20,ey,sq,o.blink||0)}</g>`+gl;}

const MOTES=[];for(let i=0;i<34;i++)MOTES.push([lerp(-800,800,rnd()),lerp(20,520,rnd()),lerp(-700,1300,rnd()),rnd()]);

// ---------- éléments de la scène ----------

const wob=(y,t,v)=>v*(6*Math.sin(y*.045+t*9)+3*Math.sin(y*.11-t*13));

// carte en colonnes : fr = [rouge, secondaire, vert] ; col3 = teinte du vert (pleine ou désaturée)
function split(R,fr,col3,v,t,a,id){if(a<=0)return '';const x0=R.x,y0=R.y,w=R.w,h=R.h,xe=x0+fr[0]*w,xs=x0+(fr[0]+fr[1])*w;

 g+=`<rect x="${f1(x0)}" y="${f1(y0+14)}" width="${f1(w)}" height="${f1(h)}" rx="18" fill="${MER}" opacity="${f3(.3*cl((w-500)/284))}"/>`;
 g+=`<g clip-path="url(#${id})"><rect x="${f1(x0)}" y="${f1(y0)}" width="${f1(w)}" height="${f1(h)}" fill="${col3}"/>`;

 g+=`<path d="M${f1(x0-20)} ${f1(y0-10)}L${edgePath(xe,y0-10,y0+h+10,t,v).slice(1)}L${f1(x0-20)} ${f1(y0+h+10)}Z" fill="${RO}"/>`;

  g+=`<path d="${edgePath(xe,y0,y0+h,t,v,11,1.25)}" fill="none" stroke="${BX}" stroke-width="3" opacity="${f3(v*(.18+.22*fl2))}"/>`;

// ---------- état de Point ----------
const PT0=[540,1172],PS=.46;
function pointAt(t){const br=Math.sin(t*2.1)*.012;let e='neutre',look=[0,-1],o={};

 else if(t<T.sq){e='surpris';look=[0,-1];o.glyph='!';o.glyphK=1-sine(P(t,.8,.25));o.sq=-.05*Math.sin(Math.PI*cl(P(t,T.oh,.25)));}
