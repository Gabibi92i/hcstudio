<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cl=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,k)=>a+(b-a)*k;

// ---------- texte : apparition mot à mot ----------

 const rx=(r[0]-l[0])/2,ry=Math.max(4,(n[1]-f[1])/2),mx=(l[0]+r[0])/2,my=(n[1]+f[1])/2;
 fl.save();fl.translate(mx,my);fl.scale(1,ry/rx);const g=fl.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(255,232,238,.10)');g.addColorStop(1,'rgba(255,232,238,0)');fl.fillStyle=g;fl.beginPath();fl.arc(0,0,rx,0,7);fl.fill();fl.restore();

// ---------- les deux fichiers, puis les deux tirages, puis l'A4 ----------

function stageSVG(t,dx,dy){let g='';
 const mp=io(P(t,T.pr,T.prE-T.pr)),ma=io(P(t,T.a4,T.a4E-T.a4)),chrome=1-cl(mp*3);
 [0,1].forEach(i=>{const C=CARD[i];let S=R(C,SHEET[i],mp);
  const IM0={x:C.x+30,y:C.y+70,w:300,h:300};let IM=R(IM0,SHEET[i],mp);
  let op=1;if(i==0){S=R(S,A4,ma);IM=R(IM,A4,ma);}else{op=1-cl(ma*1.6);const k=ma;S=R(S,{x:S.x+S.w/2,y:S.y+S.h/2,w:0,h:0},k*.4);IM=R(IM,{x:IM.x+IM.w/2,y:IM.y+IM.h/2,w:0,h:0},k*.4);}
  if(op<=0)return;

  const rr=lerp(20,4,mp);
  g+=`<rect x="${S.x}" y="${S.y}" width="${S.w}" height="${S.h}" rx="${rr}" fill="${WH}" filter="url(#sh)"/>`;
  g+=`<svg x="${IM.x}" y="${IM.y}" width="${IM.w}" height="${IM.h}" viewBox="0 0 141.4 100" preserveAspectRatio="xMidYMid slice"><use href="#pic" width="141.4" height="100"/></svg>`;

   const fk=io(P(t,T.meta,.5));

   tx(S.x+40,S.y+56,'72 PPI · 1080 PX ÷ 72',{f:WH,w:600,ls:.02})+tx(S.x+40,S.y+94,'= 15 PO = 38,1 CM',{f:WH,w:500,ls:.02})+'</g>';}

// ---------- état de Point ----------
const P1=[540,1118],P2=[806,1150],P3=[842,850],PS=.5;
function pointAt(t){const br=Math.sin(t*2.1)*.012;let e='neutre',look=[0,.2],o={};
