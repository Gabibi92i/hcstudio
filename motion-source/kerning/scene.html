<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cl=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,k)=>a+(b-a)*k;
const io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},ex=x=>{x=cl(x);return x==1?1:1-Math.pow(2,-10*x)};
const sine=x=>{x=cl(x);return .5-.5*Math.cos(Math.PI*x)};
const P=(t,a,d)=>(t-a)/d;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const WH='#F7F3F1',BX='#5C0F1E';
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const mix=(a,b,k)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`;};
// ---------- temps-clés (source unique : exportés dans times.json) ----------
const T={oh:.47,car:1.3,pfff:2.05,s1:3.3,hm:3.65,k0:4.1,tadam:5.55,s2:7.0,up:7.15,upE:7.95,tr:8.3,trE:9.5,nod:9.75,end:11.7};
const KSTEP=.2,KN=6,K0=-100;   // 6 frappes Alt+→ de +20/1000 em : −100 → +20 (réglé à l'œil)
T.taps=[...Array(KN)].map((_,i)=>+(T.k0+i*KSTEP).toFixed(3));T.kE=T.taps[KN-1]+.16;
T.hero=T.end+.11;T.land=T.end+1.46;const DUR=+(T.end+5.5).toFixed(2);
window.TIMES=Object.assign({},T,{dur:DUR});
const SH={circle:{hw:94,ey:-12},square:{hw:92,ey:-16}};
function eyesSVG(e,col,ink,look,ox,oy,sq,bk){const [lx,ly]=look||[0,0];const E=[[-34+ox,-12+oy],[34+ox,-12+oy]];let s='';
 const pup=(x,y,r=12,dx=lx,dy=ly)=>`<circle cx="${x+dx*8}" cy="${y+dy*8}" r="${r}" fill="${col}"/><circle cx="${x+dx*8-r*.38}" cy="${y+dy*8-r*.38}" r="${r*.3}" fill="${ink}"/>`;
 const ell=(x,y,rx=23,ry=28)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry*(1-sq*.6)}" fill="${ink}"/>`;
 const brow=(x1,y1,x2,y2)=>`<path d="M${x1+ox} ${y1+oy} L${x2+ox} ${y2+oy}" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`;
 const lid=(x,y,k)=>`<rect x="${x-25}" y="${y-31}" width="50" height="${62*k}" fill="${col}"/>`;
 if(bk>.92)return E.map(([x,y])=>`<path d="M${x-18} ${y} L${x+18} ${y}" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`).join('');
 switch(e){
  case 'content': return E.map(([x,y])=>`<path d="M${x-17} ${y+6} Q${x} ${y-20} ${x+17} ${y+6}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`).join('');
  case 'surpris': s=E.map(([x,y])=>ell(x,y-3,24,31)+pup(x,y-3,8,lx*.5,ly*.5)).join('')+brow(-50,-62,-20,-66)+brow(20,-66,50,-62);break;
  case 'concentre': s=E.map(([x,y])=>ell(x,y)+pup(x,y+4,11)+lid(x,y,.38)).join('')+brow(-52,-50,-18,-52)+brow(18,-52,52,-50);break;
  case 'ennuye': s=E.map(([x,y])=>ell(x,y)+pup(x,y+10,11,lx,0)+lid(x,y,.55)).join('')+brow(-52,-34,-18,-34)+brow(18,-34,52,-34);break;
  default: s=E.map(([x,y])=>ell(x,y)+pup(x,y)).join('');
 }
 if(bk>0)s+=E.map(([x,y])=>`<rect x="${x-26}" y="${y-33}" width="52" height="${66*bk}" fill="${col}"/>`).join('');
 return s;}
function chr(o){const col=o.col,ink=o.ink,sq=o.sq||0,sh=o.shape||'circle',G=SH[sh],tn=o.turn||0;
 const L=d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${o.limbs??1}"/>`;
 const sw=o.arm||0,sw2=o.alt?-sw:sw,hw=G.hw,lg=o.leg||0;
 let s=L(`M-28 94 L${-30-lg*14} 146 Q${-31-lg*14} 155 ${-46-lg*14} 155`)+L(`M28 94 L${30+lg*14} 146 Q${31+lg*14} 155 ${46+lg*14} 155`);
 s+=L(`M${-hw} 30 Q${-hw-28-sw*4} ${58-sw*6} ${-hw-16-sw*6} ${86-sw*10}`)+L(`M${hw} 30 Q${hw+28+sw2*4} ${58-sw2*6} ${hw+16+sw2*6} ${86-sw2*10}`);
 let body;
 if(sh=='square')body=`<rect x="-92" y="${-88+176*sq}" width="184" height="${184*(1-sq)}" rx="40" fill="${col}"/>`;
 else body=`<ellipse cx="0" cy="${100*sq}" rx="${100*(1+sq)}" ry="${100*(1-sq)}" fill="${col}"/>`;
 const ey=G.ey+12+(sh=='circle'?100*sq:0);
 const gk=o.glyphK||0;const gl=gk>0?`<text x="104" y="-70" transform="translate(130 -120) scale(${lerp(.86,1,gk)}) translate(-130 120)" opacity="${gk}" style="font:700 110px BG;font-stretch:80%" fill="${col}">${o.glyph}</text>`:'';
 return s+body+`<g opacity="${o.eyes??1}">${eyesSVG(o.e||'neutre',col,ink,o.look,tn*20,ey,sq,o.blink||0)}</g>`+gl;}



// ---------- caméra 3D du décor (sol) ----------
let CAM={};
function camAt(t){const k=sine(P(t,0,16));return {p:(21+1.2*k)*Math.PI/180,D:1500-40*k,f:1300,cx:540,cy:1040,yaw:.016*Math.sin(2*Math.PI*t/13)};}
function pr(X,Y,Z){const c=CAM,cy_=Math.cos(c.yaw),sy=Math.sin(c.yaw);const x=X*cy_-Z*sy,z=X*sy+Z*cy_;
 const cp=Math.cos(c.p),sp=Math.sin(c.p);const py=Y-c.D*sp,pz=z+c.D*cp;const yu=py*cp+pz*sp,zf=-py*sp+pz*cp;const s=c.f/zf;return [c.cx+x*s,c.cy-yu*s,s,zf];}


// ---------- texte : apparition mot à mot ----------
const W=[];$$('.rv').forEach(el=>{const a=+el.dataset.r;let i=0;
 const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/( )/).forEach(p=>{if(p==' '){f.append(' ');return}if(!p)return;const s=document.createElement('span');s.className='wd';s.textContent=p;f.append(s);W.push([s,a+0.075*i++,el]);});c.replaceWith(f);}else walk(c);});};walk(el);});
const LABS=$$('.lab').map(e=>[e,+e.dataset.r]);const X=$$('[data-x]').map(e=>[e,+e.dataset.x,+(e.dataset.r||0)]);
// ---------- vie : clignements ----------
const BL=[2.9,6.5,8.0,10.6];
function blinkAt(t){let k=0;BL.forEach(b=>{const d=(t-b)/.09;if(d>-1&&d<1.6)k=Math.max(k,d<0?1+d:Math.max(0,1-(d)/1.6))});return k;}

// ---------- sol ----------
const fl=$('#floor').getContext('2d'),mo=$('#motes').getContext('2d');
const MOTES=[];for(let i=0;i<34;i++)MOTES.push([lerp(-800,800,rnd()),lerp(20,520,rnd()),lerp(-700,1300,rnd()),rnd()]);
function drawFloor(t,alpha){fl.clearRect(0,0,1080,1920);if(alpha<=0)return;fl.globalAlpha=alpha;
 const Z0=300,l=pr(-650,0,Z0),r=pr(650,0,Z0),n=pr(0,0,Z0-650),f=pr(0,0,Z0+650);
 const rx=(r[0]-l[0])/2,ry=Math.max(4,(n[1]-f[1])/2),mx=(l[0]+r[0])/2,my=(n[1]+f[1])/2;
 fl.save();fl.translate(mx,my);fl.scale(1,ry/rx);const g=fl.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(255,232,238,.10)');g.addColorStop(1,'rgba(255,232,238,0)');fl.fillStyle=g;fl.beginPath();fl.arc(0,0,rx,0,7);fl.fill();fl.restore();
 // ombre de la carte sur le sol
 const s0=pr(-420,0,120),s1=pr(420,0,120),s2=pr(0,0,40),s3=pr(0,0,200);
 fl.save();fl.translate((s0[0]+s1[0])/2,(s2[1]+s3[1])/2);fl.scale(1,Math.max(.05,(s2[1]-s3[1])/(s1[0]-s0[0])));const sg=fl.createRadialGradient(0,0,0,0,0,(s1[0]-s0[0])/2);sg.addColorStop(0,'rgba(30,3,9,.30)');sg.addColorStop(1,'rgba(30,3,9,0)');fl.fillStyle=sg;fl.beginPath();fl.arc(0,0,(s1[0]-s0[0])/2,0,7);fl.fill();fl.restore();
 fl.fillStyle='#F7F3F1';
 for(let X=-975;X<=975;X+=75)for(let Z=-750;Z<=1950;Z+=75){const p=pr(X,0,Z);if(p[3]<80)continue;
  const fog=cl(1-(Z+200)/2150)*cl(1-Math.abs(X)/1050),a=.20*fog*fog;if(a<.01)continue;fl.globalAlpha=alpha*a;fl.beginPath();fl.arc(p[0],p[1],Math.max(.8,2.4*p[2]),0,7);fl.fill();}
 fl.globalAlpha=1;}
function drawMotes(t,alpha){mo.clearRect(0,0,1080,1920);if(alpha<=0)return;
 MOTES.forEach(([x,y,z,r],i)=>{const yy=y+((t*14*(.5+r))%500),xx=x+Math.sin(t*.3+i)*30;const p=pr(xx,(yy%540)+10,z);if(p[3]<60)return;
  const rad=(1.2+3.5*r)*p[2]*1.4,a=alpha*(.10+.16*r)*cl(1-Math.abs(p[1]-900)/1100);
  const g=mo.createRadialGradient(p[0],p[1],0,p[0],p[1],rad*2.2);g.addColorStop(0,`rgba(247,243,241,${a})`);g.addColorStop(1,'rgba(247,243,241,0)');mo.fillStyle=g;mo.beginPath();mo.arc(p[0],p[1],rad*2.2,0,7);mo.fill();});}

// ---------- le mot sur la carte : chaque lettre placée à la main ----------
const LO='modern',UP='MODERN',SZL=176,SZU=128,BASE=262,WCX=318;
const wordEl=$('#word');
const mkGl=(s,sz)=>[...s].map(c=>{const e=document.createElement('span');e.className='gl';e.textContent=c;e.style.fontSize=sz+'px';wordEl.append(e);return e;});
const GL=mkGl(LO,SZL),GU=mkGl(UP,SZU);
let LAY=null;
function layout(){ // largeur des préfixes (avec le crénage d'origine de la police)
 const m=$('#meas');const pre=(s,sz)=>{m.style.font=`700 ${sz}px BG`;m.style.fontStretch='80%';const r=[];for(let i=0;i<=s.length;i++){m.textContent=s.slice(0,i)||'';r.push(m.getBoundingClientRect().width);}return r;};
 return {l:pre(LO,SZL),u:pre(UP,SZU)};}
const kernAt=t=>K0+20*T.taps.reduce((s,a)=>s+io(P(t,a,.14)),0);
const trackAt=t=>100*io(P(t,T.tr,T.trE-T.tr));
// positions x (bord gauche) des lettres minuscules / capitales
function xsLo(t){const L=LAY.l,k=kernAt(t)*SZL/1000,x0=WCX-L[6]/2;return L.slice(0,6).map((w,i)=>x0+w+(i>=5?k:0));}
function xsUp(t){const U=LAY.u,tr=trackAt(t)*SZU/1000,x0=WCX-(U[6]+5*tr)/2;return U.slice(0,6).map((w,i)=>x0+w+i*tr);}
function gapsLo(t){const L=LAY.l,xs=xsLo(t);return [{x:(xs[4]+(L[5]-L[4])+xs[5])/2,i:4}];}
function wordRender(t){
 if(!LAY||!LAY.ok){LAY=layout();LAY.ok=document.fonts.status=='loaded';}
 const mk=io(P(t,T.up,T.upE-T.up)),xl=xsLo(t),xu=xsUp(t);
 GL.forEach((e,i)=>{const x=lerp(xl[i],xu[i],mk);e.style.transform=`translate(${x.toFixed(2)}px,${(BASE-SZL*.95).toFixed(1)}px)`;e.style.opacity=1-cl(mk*1.6);e.style.filter=mk>0&&mk<1?`blur(${(Math.sin(Math.PI*mk)*9).toFixed(2)}px)`:'none';});
 GU.forEach((e,i)=>{const x=lerp(xl[i],xu[i],mk);e.style.transform=`translate(${x.toFixed(2)}px,${(BASE-SZU*.95).toFixed(1)}px)`;e.style.opacity=cl(mk*1.6-.6);e.style.filter=mk>0&&mk<1?`blur(${(Math.sin(Math.PI*mk)*9).toFixed(2)}px)`:'none';});
 return {mk,xl,xu};}
// ---------- l'interface de la carte : curseur, repères d'espace ----------
const rgba=a=>`rgba(92,15,30,${a.toFixed(3)})`;
function cardSVG(t,W_){const {mk,xl,xu}=W_,L=LAY.l,U=LAY.u;let g='';
 // repères de coin + ligne de base
 g+=`<g fill="none" stroke="${BX}" stroke-width="3" opacity=".5"><path d="M20 44V20H44M740 20H764V44M20 397V421H44M764 397V421H740"/></g>`;
 g+=`<path d="M40 ${BASE+1}H744" stroke="${rgba(.18)}" stroke-width="2" stroke-dasharray="4 8"/>`;
 g+=`<text x="40" y="60" style="font:600 25px GM;letter-spacing:.08em" fill="${BX}">TITRE · ${mk<.5?'176':'128'} PX</text>`;
 g+=`<text x="744" y="60" text-anchor="end" style="font:500 25px GM;letter-spacing:.06em" fill="${BX}" opacity=".7">${mk<.5?'bas de casse':'CAPITALES'}</text>`;
 // curseur de texte entre r et n
 const gx=(xl[4]+(L[5]-L[4])+xl[5])/2;const ca=cl(P(t,T.car,.25))*(1-cl(P(t,T.kE+.5,.4)));
 const blinkC=t<T.k0-.1?(Math.cos(2*Math.PI*(t-T.car)/1.0)>-.3?1:.15):1;
 if(ca>0){g+=`<rect x="${(gx-1.75).toFixed(2)}" y="${BASE-150}" width="3.5" height="178" fill="${BX}" opacity="${(ca*blinkC).toFixed(3)}"/>`;
  const kv=Math.round(kernAt(t)/20)*20;
  g+=`<g opacity="${ca.toFixed(3)}"><rect x="${(gx-62).toFixed(1)}" y="${BASE-206}" width="124" height="42" rx="21" fill="${BX}"/><text x="${gx.toFixed(1)}" y="${BASE-176}" text-anchor="middle" style="font:600 25px GM" fill="${WH}">${kv>0?'+':kv<0?'−':''}${Math.abs(kv)}</text></g>`;}
 // repères d'espace sous la ligne de base : un seul (kerning) puis tous (tracking)
 const one=cl(P(t,T.car+.2,.4))*(1-cl(P(t,T.kE+.5,.4)));
 const kw=Math.max(0,(xl[5]-(xl[4]+(L[5]-L[4]))));
 if(one>0)g+=`<rect x="${(gx-kw/2-3).toFixed(1)}" y="${BASE+22}" width="${(kw+6).toFixed(1)}" height="8" rx="4" fill="${BX}" opacity="${(one*.85).toFixed(3)}"/>`;
 const all=cl(P(t,T.tr-.25,.35))*(1-cl(P(t,T.end,.5)));
 if(all>0){const tr=trackAt(t)*SZU/1000;for(let i=0;i<5;i++){const a=xu[i]+(U[i+1]-U[i]),b=xu[i+1];const cx=(a+b)/2;const w=Math.max(0,b-a);
  g+=`<rect x="${(cx-w/2-3).toFixed(1)}" y="${BASE+22}" width="${(w+6).toFixed(1)}" height="8" rx="4" fill="${BX}" opacity="${(all*.85*cl(.35+tr/8)).toFixed(3)}"/>`;}
  g+=`<path d="M${(xu[0]).toFixed(1)} ${BASE+52}V${BASE+66}H${(xu[5]+(U[6]-U[5])).toFixed(1)}V${BASE+52}" fill="none" stroke="${BX}" stroke-width="3" stroke-linejoin="round" opacity="${(all*.6).toFixed(3)}"/>`;}
 // ombre de Point sur la ligne de base
 const p=pointAt(t);g+=`<ellipse cx="${p.x.toFixed(1)}" cy="${BASE+2}" rx="${(80*p.s).toFixed(1)}" ry="${(12*p.s).toFixed(1)}" fill="${rgba(.14)}"/>`;
 return g;}
// ---------- panneau sous la carte : valeurs réelles + touches ----------
function key(x,y,lab,down){const d=down*5;return `<g transform="translate(${x} ${y+d})"><rect x="-30" y="-30" width="60" height="60" rx="12" fill="${down>.3?WH:'none'}" stroke="${WH}" stroke-width="2.5"/><text x="0" y="11" text-anchor="middle" style="font:600 30px GM" fill="${down>.3?BX:WH}">${lab}</text></g>`;}
function panelSVG(t,a){if(a<=0)return '';const mk=io(P(t,T.up-.1,.6));
 let g=`<g opacity="${a.toFixed(3)}"><rect x="148" y="1094" width="784" height="156" rx="18" fill="rgba(30,3,9,.30)"/>`;
 const kv=Math.round(kernAt(t)/20)*20,tv=Math.round(trackAt(t)/10)*10;const sg=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
 const press=T.taps.reduce((m,s)=>Math.max(m,Math.sin(Math.PI*cl(P(t,s,.15)))),0);
 g+=`<g opacity="${(1-mk).toFixed(3)}"><text x="196" y="1150" style="font:500 25px GM;letter-spacing:.12em" fill="${WH}" opacity=".7">KERNING · r|n</text><text x="196" y="1210" style="font:600 50px GM" fill="${WH}">${sg(kv)}</text>
  ${key(772,1186,'⌥',press)}${key(848,1186,'→',press)}<text x="884" y="1150" text-anchor="end" style="font:500 25px GM;letter-spacing:.12em" fill="${WH}" opacity=".7">2 LETTRES</text></g>`;
 g+=`<g opacity="${mk.toFixed(3)}"><text x="196" y="1150" style="font:500 25px GM;letter-spacing:.12em" fill="${WH}" opacity=".7">TRACKING · MOT</text><text x="196" y="1210" style="font:600 50px GM" fill="${WH}">${sg(tv)}</text>
  <text x="884" y="1150" text-anchor="end" style="font:500 25px GM;letter-spacing:.12em" fill="${WH}" opacity=".7">TOUT LE MOT</text><text x="884" y="1210" text-anchor="end" style="font:600 50px GM" fill="${WH}">6 LETTRES</text></g>`;
 return g+'</g>';}
// ---------- état de Point (posé sur la ligne de base, à droite du mot) ----------
const PS=.5,PX=672;
function pointAt(t){const br=Math.sin(t*2.1)*.012;let e='neutre',look=[-.7,.2],o={},x=PX,y=BASE-78*1.0-0;
 const tapK=T.taps.reduce((m,s)=>Math.max(m,Math.sin(Math.PI*cl(P(t,s-.04,.17)))),0);
 if(t<T.oh){e='neutre';look=[-.8,.1];}
 else if(t<T.car+.5){e='surpris';look=[-.8,-.1];o.glyph='!';o.glyphK=1-sine(P(t,1.45,.3));o.sq=-.06*Math.sin(Math.PI*cl(P(t,T.oh,.25)));}
 else if(t<T.pfff){e='surpris';look=[-.9,.2];}
 else if(t<T.hm){e='ennuye';look=[-.8,.3];o.sq=.03*Math.sin(Math.PI*cl(P(t,T.pfff,.4)));}
 else if(t<T.tadam){e='concentre';look=[-.9,.4];o.arm=-1.2*tapK;o.alt=1;}
 else if(t<T.up){e='content';look=[-.2,-.2];o.sq=.08*Math.sin(Math.PI*cl(P(t,T.tadam,.3)));o.arm=1.4*Math.sin(Math.PI*cl(P(t,T.tadam,.9)));}
 else if(t<T.tr){e='neutre';look=[-.9,-.1];}
 else if(t<T.nod){e='concentre';look=[lerp(-1,-.5,cl(P(t,T.tr,1.2))),.2];}
 else {e=t<T.end-.25?'content':'neutre';look=[-.3,-.2];o.sq=.06*Math.sin(Math.PI*cl(P(t,T.nod,.3)));}
 const sq=(o.sq||0)+br;
 return Object.assign({x,y:BASE-78,s:PS,e,look,turn:-.25},o,{sq});}
// ---------- grain + signature ----------
const g=$('#grain').getContext('2d'),img=g.createImageData(540,960);
const L1=$('#p1').getTotalLength(),L2=$('#p2').getTotalLength();$('#p1').style.strokeDasharray=L1;$('#p2').style.strokeDasharray=L2;
const SIG={x:340+(470-60)*400/430,y:556+(400-95)*400/430,r:9*400/430};
const card=$('#card'),cv=$('#cv');
window.render=function(t){
 seed=1+Math.floor(t*30)*7919;for(let i=0;i<img.data.length;i+=4){const v=rnd()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}g.putImageData(img,0,0);
 CAM=camAt(t);
 const outK=sine(P(t,T.end,.8)),stA=1-outK;
 drawFloor(t,stA*.9+.1);drawMotes(t,stA);
 W.forEach(([s,a])=>{const k=ex(P(t,a,1.0));s.style.opacity=cl(P(t,a,.5));s.style.transform=`translateY(${(1-k)*36}px)`;s.style.filter=k<.995?`blur(${(1-k)*14}px)`:'none';});
 LABS.forEach(([e,a])=>e.style.setProperty('--k',io(P(t,a+.1,1.2))));
 X.forEach(([e,a])=>{const o=sine(P(t,a,.6));e.style.opacity=1-o;e.style.filter=o>0&&o<1?`blur(${o*12}px)`:'none';e.style.transform=`translateY(${-o*28}px)`;e.style.visibility=o>=1?'hidden':'visible';});
 const dx=3*Math.sin(2*Math.PI*t/9),dy=5*Math.sin(2*Math.PI*t/7)-outK*20,cs=1-.04*outK;
 const CX=148+dx,CY=628+dy;
 card.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${cs})`;card.style.opacity=stA;card.style.filter=outK>0?`blur(${outK*10}px)`:'none';card.style.visibility=stA<=0?'hidden':'visible';
 const Wd=wordRender(t),pt=pointAt(t);
 cv.innerHTML=cardSVG(t,Wd);
 $('#tlg').innerHTML=panelSVG(t,stA);$('#tlg').style.filter=outK>0?`blur(${outK*10}px)`:'none';
 const R=$('#ccr');R.setAttribute('x',CX);R.setAttribute('y',CY);R.setAttribute('width',784);R.setAttribute('height',441);
 const ptE=$('#pt');
 if(t>=T.end-.01){ // il sort de la carte et devient le point de « hc. »
  const p0=pointAt(T.end-.02);const sx=CX+p0.x,sy=CY+p0.y;const k=io(P(t,T.hero,T.land-T.hero));const ck=cl(P(t,T.end,.45));
  const col=mix(BX,WH,ck),ink=mix(WH,BX,ck);const ant=Math.sin(Math.PI*cl(P(t,T.hero,.3)))*.05;
  const cx=lerp(sx,SIG.x,k),cy=lerp(sy,SIG.y,k)-Math.sin(Math.PI*k)*90,sc=lerp(p0.s,SIG.r/100,k);
  $('#ptw').removeAttribute('clip-path');
  ptE.setAttribute('transform',`translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${sc.toFixed(4)})`);
  ptE.innerHTML=chr({col,ink,sq:ant,limbs:1-cl((k-.3)*2.2),eyes:1-cl((k-.55)*2.5),e:'content',look:[.4,-.4],blink:0,arm:.6});
  ptE.style.visibility=t>=T.land?'hidden':'visible';}
 else{$('#ptw').setAttribute('clip-path','url(#cc)');ptE.style.visibility='visible';
  ptE.setAttribute('transform',`translate(${(CX+pt.x).toFixed(1)} ${(CY+pt.y).toFixed(1)}) scale(${pt.s.toFixed(4)})`);
  ptE.innerHTML=chr(Object.assign({col:BX,ink:WH,blink:blinkAt(t)},pt));}
 $('#p1').style.strokeDashoffset=L1*(1-io(P(t,T.end+.28,.95)));$('#p2').style.strokeDashoffset=L2*(1-io(P(t,T.end+1.04,.36)));
 const ld=P(t,T.land,.5);$('#sigdot').setAttribute('cx',SIG.x);$('#sigdot').setAttribute('cy',SIG.y);$('#sigdot').setAttribute('r',t>=T.land?SIG.r*(1+.35*Math.sin(Math.PI*cl(ld))*(1-cl(ld))):0);
 const pk=ex(P(t,T.end+1.2,1));$('#pill').style.opacity=pk;$('#pill').style.borderColor=`rgba(247,243,241,${.6*pk})`;$('#pill').style.transform=`translateX(-50%) translateY(${(1-pk)*12}px)`;
};
window.render(0);
</script></body></html>
