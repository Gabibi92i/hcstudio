<script>

// ---------- temps-clés (source unique : exportés dans times.json) ----------

const SH={circle:{hw:94,ey:-12},square:{hw:92,ey:-16}};
function eyesSVG(e,col,ink,look,ox,oy,sq,bk){const [lx,ly]=look||[0,0];const E=[[-34+ox,-12+oy],[34+ox,-12+oy]];let s='';
 const pup=(x,y,r=12,dx=lx,dy=ly)=>`<circle cx="${x+dx*8}" cy="${y+dy*8}" r="${r}" fill="${col}"/><circle cx="${x+dx*8-r*.38}" cy="${y+dy*8-r*.38}" r="${r*.3}" fill="${ink}"/>`;
 const ell=(x,y,rx=23,ry=28)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry*(1-sq*.6)}" fill="${ink}"/>`;
 const brow=(x1,y1,x2,y2)=>`<path d="M${x1+ox} ${y1+oy} L${x2+ox} ${y2+oy}" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`;
 const lid=(x,y,k)=>`<rect x="${x-25}" y="${y-31}" width="50" height="${62*k}" fill="${col}"/>`;
 if(bk>.92)return E.map(([x,y])=>`<path d="M${x-18} ${y} L${x+18} ${y}" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`).join('');
 switch(e){
  case 'content': return E.map(([x,y])=>`<path d="M${x-17} ${y+6} Q${x} ${y-20} ${x+17} ${y+6}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`).join('');
  case 'surpris': s=E.map(([x,y])=>ell(x,y-3,24,31)+pup(x,y-3,8,lx*.5,ly*.5)).join('')+brow(-50,-62,-20,-66)+brow(20,-66,50,-62);break;
  case 'concentre': s=E.map(([x,y])=>ell(x,y)+pup(x,y+4,11)+lid(x,y,.38)).join('')+brow(-52,-50,-18,-52)+brow(18,-52,52,-50);break;
  case 'ennuye': s=E.map(([x,y])=>ell(x,y)+pup(x,y+10,11,lx,0)+lid(x,y,.55)).join('')+brow(-52,-34,-18,-34)+brow(18,-34,52,-34);break;
  default: s=E.map(([x,y])=>ell(x,y)+pup(x,y)).join('');
 }
 if(bk>0)s+=E.map(([x,y])=>`<rect x="${x-26}" y="${y-33}" width="52" height="${66*bk}" fill="${col}"/>`).join('');
 return s;}

function chr(o){const col=o.col,ink=o.ink,sq=o.sq||0,sh=o.shape||'circle',G=SH[sh],tn=o.turn||0;
 const L=d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${o.limbs??1}"/>`;
 const sw=o.arm||0,sw2=o.alt?-sw:sw,hw=G.hw,lg=o.leg||0;
 let s=L(`M-28 94 L${-30-lg*14} 146 Q${-31-lg*14} 155 ${-46-lg*14} 155`)+L(`M28 94 L${30+lg*14} 146 Q${31+lg*14} 155 ${46+lg*14} 155`);
 s+=L(`M${-hw} 30 Q${-hw-28-sw*4} ${58-sw*6} ${-hw-16-sw*6} ${86-sw*10}`);
 if(o.reach){const [hx_,hy_]=o.reach,mx=(hw+hx_)/2,my=(30+hy_)/2,dx=hx_-hw,dy=hy_-30,n=Math.hypot(dx,dy)||1,b=Math.min(40,n*.18);

 else s+=L(`M${hw} 30 Q${hw+28+sw2*4} ${58-sw2*6} ${hw+16+sw2*6} ${86-sw2*10}`);
 const body=`<ellipse cx="0" cy="${100*sq}" rx="${100*(1+sq)}" ry="${100*(1-sq)}" fill="${col}"/>`;

 const gk=o.glyphK||0;const gl=gk>0?`<text x="104" y="-70" transform="translate(130 -120) scale(${lerp(.86,1,gk)}) translate(-130 120)" opacity="${gk}" style="font:700 110px BG;font-stretch:80%" fill="${col}">${o.glyph}</text>`:'';
 return s+body+`<g opacity="${o.eyes??1}">${eyesSVG(o.e||'neutre',col,ink,o.look,tn*20,ey,sq,o.blink||0)}</g>`+gl;}

let CAM={};

function pr(X,Y,Z){const c=CAM,cy_=Math.cos(c.yaw),sy=Math.sin(c.yaw);const x=X*cy_-Z*sy,z=X*sy+Z*cy_;
 const cp=Math.cos(c.p),sp=Math.sin(c.p);const py=Y-c.D*sp,pz=z+c.D*cp;const yu=py*cp+pz*sp,zf=-py*sp+pz*cp;const s=c.f/zf;return [c.cx+x*s,c.cy-yu*s,s,zf];}
function drawFloor(t,alpha){fl.clearRect(0,0,1080,1920);if(alpha<=0)return;fl.globalAlpha=alpha;

 fl.save();fl.translate(mx,my);fl.scale(1,ry/rx);const g=fl.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(255,232,238,.10)');g.addColorStop(1,'rgba(255,232,238,0)');fl.fillStyle=g;fl.beginPath();fl.arc(0,0,rx,0,7);fl.fill();fl.restore();

// ---------- texte : apparition mot à mot ----------

 const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/( )/).forEach(p=>{if(p==' '){f.append(' ');return}if(!p)return;const s=document.createElement('span');s.className='wd';s.textContent=p;f.append(s);W.push([s,a+0.075*i++,el]);});c.replaceWith(f);}else walk(c);});};walk(el);});
const LABS=$$('.lab').map(e=>[e,+e.dataset.r]);const X=$$('[data-x]').map(e=>[e,+e.dataset.x,+(e.dataset.r||0)]);
// ---------- vie : clignements ----------
const BL=[1.6,3.3,5.0,6.9,8.6,10.6,11.5];

const fl=$('#floor').getContext('2d'),mo=$('#motes').getContext('2d');

// ---------- l'écran (coordonnées locales de la carte 784 x 460) ----------

function screenSVG(t){let g='';
 g+=`<rect x="0" y="0" width="784" height="44" fill="${rgba(.06)}"/>`;
 [26,48,70].forEach(x=>g+=`<circle cx="${x}" cy="22" r="6" fill="${rgba(.22)}"/>`);

 g+=`<rect x="48" y="92" width="250" height="26" rx="8" fill="${rgba(.16)}"/>`;
 [[136,330],[162,290],[188,210]].forEach(([y,w])=>g+=`<rect x="48" y="${y}" width="${w}" height="14" rx="7" fill="${rgba(.09)}"/>`);
 // sol discret
 for(let x=24;x<=760;x+=32)g+=`<circle cx="${x}" cy="${GROUND+18}" r="2.2" fill="${rgba(.14)}"/>`;
 g+=`<ellipse cx="${PT0[0]}" cy="${GROUND}" rx="${(80*PS).toFixed(1)}" ry="${(14*PS).toFixed(1)}" fill="${rgba(.14)}"/>`;
 const b=btnAt(t);
 // D : la distance entre Point et le bouton

 if(dk>0){const dx=b.x-PT0[0],dy=b.y-PT0[1],n=Math.hypot(dx,dy),ux=dx/n,uy=dy/n,r0=72,r1=Math.min(b.w,b.h)/2+14+(1-b.k)*6;

  const la=cl(P(t,T.d1+.45,.4)),mx=x0+ux*len*.5+uy*30,my=y0+uy*len*.5-ux*30;

 // W : la taille de la cible
 const wk=io(P(t,T.w1,.6));
 if(wk>0){const y=b.y-b.h/2-16,x0=b.x-b.w/2,x1=b.x+b.w/2;
  g+=`<g opacity="${wk.toFixed(3)}" stroke="${rgba(.6)}" stroke-width="3" stroke-linecap="round"><path d="M${x0.toFixed(1)} ${(y-8).toFixed(1)}V${(y+8).toFixed(1)}M${x1.toFixed(1)} ${(y-8).toFixed(1)}V${(y+8).toFixed(1)}M${x0.toFixed(1)} ${y.toFixed(1)}H${x1.toFixed(1)}"/></g>`;
  g+=`<text x="${b.x.toFixed(1)}" y="${(y-14).toFixed(1)}" text-anchor="middle" style="font:600 30px GM" fill="${BX}" opacity="${wk.toFixed(3)}">W</text>`;}

 // le bouton

 g+=`<text x="${b.x.toFixed(1)}" y="${(b.y+b.h*.16).toFixed(1)}" text-anchor="middle" style="font:700 ${(b.h*.46).toFixed(1)}px BG;font-stretch:85%" fill="${WH}">OK</text>`;
 // onde du clic réussi

// ---------- état de Point (l'utilisateur) ----------
function pointAt(t){const br=Math.sin(t*2.1)*.012,b=btnAt(t);let e='neutre',look=[.6,-.6],o={},rk=0,tgt=null,lean=0,hop=0;

 else if(t<T.pfff){e='concentre';look=dirB();tgt=[b.x,b.y];rk=.66*io(P(t,T.reach,T.reachE-T.reach))+(t>T.reachE?.012*Math.sin((t-T.reachE)*26):0);hop=io(P(t,T.reach,.6))*14;lean=10*io(P(t,T.reach,.8));}
 else if(t<T.s1+.6){e='ennuye';look=[.3,.3];tgt=[b.x,b.y];const k=io(P(t,T.pfff,.55));rk=.66*(1-k);hop=14*(1-k);lean=10*(1-k);}
 else if(t<T.hm){e='neutre';look=t<T.w1?dirB().map(v=>v*.6):dirB();}
 else if(t<T.mv){e='concentre';look=dirB();}
 else if(t<T.tapS){e='surpris';look=dirB();o.sq=-.04*Math.sin(Math.PI*cl(P(t,T.mv,.3)));}
 else if(t<T.tadam+.4){e='concentre';look=dirB();tgt=[b.x-b.w/2+4,b.y];rk=io(P(t,T.tapS,T.tap-T.tapS))*(1-io(P(t,T.tadam+.05,.35)));}
 else if(t<T.end-.25){e='content';look=[.1,-.2];o.sq=.07*Math.sin(Math.PI*cl(P(t,T.tadam+.4,.3)));o.arm=1.4*Math.sin(Math.PI*cl(P(t,T.tadam+.4,.9)));}
 else {e='neutre';look=[0,0];}
 const x=PT0[0],y=PT0[1]-hop;
 if(rk>0&&tgt){const a=-lean*Math.PI/180,vx=(tgt[0]-x)/PS,vy=(tgt[1]-y)/PS,lx=vx*Math.cos(a)-vy*Math.sin(a),ly=vx*Math.sin(a)+vy*Math.cos(a);o.reach=[lerp(94,lx,rk),lerp(30,ly,rk)];}

// ---------- tableau de bord sous l'écran ----------
const mark=(x,y,ok,a)=>ok?`<path d="M${x-12} ${y}l9 9l17-19" fill="none" stroke="${WH}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="${a}"/>`:`<path d="M${x-10} ${y-10}l20 20M${x+10} ${y-10}l-20 20" stroke="${WH}" stroke-width="4.5" stroke-linecap="round" opacity="${a}"/>`;
const tw=(s,px)=>s.length*px*.6;
function hudSVG(t,a){a*=sine(P(t,T.d1-.1,.7));if(a<=0)return '';
 const k=sine(P(t,T.mv+.35,.5));
 let g=`<g opacity="${a.toFixed(3)}"><rect x="148" y="1090" width="784" height="156" rx="18" fill="rgba(30,3,9,.30)"/>`;
 const L=(x,anc,txt,o)=>`<text x="${x}" y="1146" text-anchor="${anc}" style="font:500 25px GM;letter-spacing:.12em" fill="${WH}" opacity="${(.7*o).toFixed(3)}">${txt}</text>`;
