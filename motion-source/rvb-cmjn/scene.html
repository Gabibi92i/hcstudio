<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cl=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,k)=>a+(b-a)*k;

// ---------- temps-clés (source unique : exportés dans times.json) ----------
const T={oh:.45,pfff:1.9,s1:3.25,join:3.7,joinE:4.7,hm:4.75,s2:6.3,flip:6.45,flipE:7.25,s3:9.35,gam:9.55,gamE:10.4,clamp:10.75,clampE:11.45,pfff2:11.55,s4:12.4,back:12.45,backE:13.35,mode:13.55,s5:15.45,proof:16.0,proofE:16.7,tadam:16.8,end:18.45};

// ---------- Point (rond, yeux seulement, membres au trait) ----------
const SH={circle:{hw:94,ey:-12}};
function eyesSVG(e,col,ink,look,ox,oy,sq,bk){const [lx,ly]=look||[0,0];const E=[[-34+ox,-12+oy],[34+ox,-12+oy]];let s='';
 const pup=(x,y,r=12,dx=lx,dy=ly)=>`<circle cx="${x+dx*8}" cy="${y+dy*8}" r="${r}" fill="${col}"/><circle cx="${x+dx*8-r*.38}" cy="${y+dy*8-r*.38}" r="${r*.3}" fill="${ink}"/>`;
 const ell=(x,y,rx=23,ry=28)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry*(1-sq*.6)}" fill="${ink}"/>`;
 const brow=(x1,y1,x2,y2)=>`<path d="M${x1+ox} ${y1+oy} L${x2+ox} ${y2+oy}" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`;
 const lid=(x,y,k)=>`<rect x="${x-25}" y="${y-31}" width="50" height="${62*k}" fill="${col}"/>`;
 if(bk>.92)return E.map(([x,y])=>`<path d="M${x-18} ${y} L${x+18} ${y}" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`).join('');
 switch(e){
  case 'content': return E.map(([x,y])=>`<path d="M${x-17} ${y+6} Q${x} ${y-20} ${x+17} ${y+6}" fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"/>`).join('');
  case 'surpris': s=E.map(([x,y])=>ell(x,y-3,24,31)+pup(x,y-3,8,lx*.5,ly*.5)).join('')+brow(-50,-62,-20,-66)+brow(20,-66,50,-62);break;
  case 'concentre': s=E.map(([x,y])=>ell(x,y)+pup(x,y+4,11)+lid(x,y,.38)).join('')+brow(-52,-50,-18,-52)+brow(18,-52,52,-50);break;
  case 'ennuye': s=E.map(([x,y])=>ell(x,y)+pup(x,y+10,11,lx,0)+lid(x,y,.55)).join('')+brow(-52,-34,-18,-34)+brow(18,-34,52,-34);break;
  default: s=E.map(([x,y])=>ell(x,y)+pup(x,y)).join('');
 }
 if(bk>0)s+=E.map(([x,y])=>`<rect x="${x-26}" y="${y-33}" width="52" height="${66*bk}" fill="${col}"/>`).join('');
 return s;}
function chr(o){const col=o.col,ink=o.ink,sq=o.sq||0,G=SH.circle,tn=o.turn||0;
 const L=d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${o.limbs??1}"/>`;
 const sw=o.arm||0,hw=G.hw;
 let s=L(`M-28 94 L-30 146 Q-31 155 -46 155`)+L(`M28 94 L30 146 Q31 155 46 155`);
 s+=L(`M${-hw} 30 Q${-hw-28-sw*4} ${58-sw*6} ${-hw-16-sw*6} ${86-sw*10}`)+L(`M${hw} 30 Q${hw+28+sw*4} ${58-sw*6} ${hw+16+sw*6} ${86-sw*10}`);
 const body=`<ellipse cx="0" cy="${100*sq}" rx="${100*(1+sq)}" ry="${100*(1-sq)}" fill="${col}"/>`;
 const ey=G.ey+12+100*sq;
 const gk=o.glyphK||0;const gx=o.gx??104,gy=o.gy??-70;const gl=gk>0?`<text x="${gx}" y="${gy}" transform="translate(${gx+26} ${gy-50}) scale(${lerp(.86,1,gk)}) translate(${-gx-26} ${50-gy})" opacity="${gk}" style="font:700 110px BG;font-stretch:80%" fill="${col}">${o.glyph}</text>`:'';
 return s+body+`<g opacity="${o.eyes??1}">${eyesSVG(o.e||'neutre',col,ink,o.look,tn*20,ey,sq,o.blink||0)}</g>`+gl;}
// ---------- caméra 3D du décor (sol) ----------
let CAM={};
function camAt(t){const k=sine(P(t,0,22));return {p:(21+1.2*k)*Math.PI/180,D:1500-40*k,f:1300,cx:540,cy:1040,yaw:.016*Math.sin(2*Math.PI*t/13)};}
function pr(X,Y,Z){const c=CAM,cy_=Math.cos(c.yaw),sy=Math.sin(c.yaw);const x=X*cy_-Z*sy,z=X*sy+Z*cy_;
 const cp=Math.cos(c.p),sp=Math.sin(c.p);const py=Y-c.D*sp,pz=z+c.D*cp;const yu=py*cp+pz*sp,zf=-py*sp+pz*cp;const s=c.f/zf;return [c.cx+x*s,c.cy-yu*s,s,zf];}
// ---------- texte : apparition mot à mot ----------
const W=[];$$('.rv').forEach(el=>{const a=+el.dataset.r;let i=0;
 const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/( )/).forEach(p=>{if(p==' '){f.append(' ');return}if(!p)return;const s=document.createElement('span');s.className='wd';s.textContent=p;f.append(s);W.push([s,a+0.075*i++,el]);});c.replaceWith(f);}else walk(c);});};walk(el);});
const LABS=$$('.lab').map(e=>[e,+e.dataset.r]);const X=$$('[data-x]').map(e=>[e,+e.dataset.x,+(e.dataset.r||0)]);
const BL=[1.3,3.0,5.9,8.4,10.2,13.9,15.2,17.9];
function blinkAt(t){let k=0;BL.forEach(b=>{const d=(t-b)/.09;if(d>-1&&d<1.6)k=Math.max(k,d<0?1+d:Math.max(0,1-(d)/1.6))});return k;}
// ---------- sol ----------
const fl=$('#floor').getContext('2d'),mo=$('#motes').getContext('2d');
const MOTES=[];for(let i=0;i<34;i++)MOTES.push([lerp(-800,800,rnd()),lerp(20,520,rnd()),lerp(-700,1300,rnd()),rnd()]);
function drawFloor(t,alpha){fl.clearRect(0,0,1080,1920);if(alpha<=0)return;fl.globalAlpha=alpha;
 const Z0=300,l=pr(-650,0,Z0),r=pr(650,0,Z0),n=pr(0,0,Z0-650),f=pr(0,0,Z0+650);
 const rx=(r[0]-l[0])/2,ry=Math.max(4,(n[1]-f[1])/2),mx=(l[0]+r[0])/2,my=(n[1]+f[1])/2;
 fl.save();fl.translate(mx,my);fl.scale(1,ry/rx);const g=fl.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(255,232,238,.10)');g.addColorStop(1,'rgba(255,232,238,0)');fl.fillStyle=g;fl.beginPath();fl.arc(0,0,rx,0,7);fl.fill();fl.restore();
 fl.fillStyle='#F7F3F1';
 for(let X=-975;X<=975;X+=75)for(let Z=-750;Z<=1950;Z+=75){const p=pr(X,0,Z);if(p[3]<80)continue;
  const fog=cl(1-(Z+200)/2150)*cl(1-Math.abs(X)/1050),a=.20*fog*fog;if(a<.01)continue;fl.globalAlpha=alpha*a;fl.beginPath();fl.arc(p[0],p[1],Math.max(.8,2.4*p[2]),0,7);fl.fill();}

function drawMotes(t,alpha){mo.clearRect(0,0,1080,1920);if(alpha<=0)return;
 MOTES.forEach(([x,y,z,r],i)=>{const yy=y+((t*14*(.5+r))%500),xx=x+Math.sin(t*.3+i)*30;const p=pr(xx,(yy%540)+10,z);if(p[3]<60)return;
  const rad=(1.2+3.5*r)*p[2]*1.4,a=alpha*(.10+.16*r)*cl(1-Math.abs(p[1]-900)/1100);
  const g=mo.createRadialGradient(p[0],p[1],0,p[0],p[1],rad*2.2);g.addColorStop(0,`rgba(247,243,241,${a})`);g.addColorStop(1,'rgba(247,243,241,0)');mo.fillStyle=g;mo.beginPath();mo.arc(p[0],p[1],rad*2.2,0,7);mo.fill();});}
// ---------- éléments de la scène ----------
const f1=v=>(+v).toFixed(1),f3=v=>(+v).toFixed(3);
const mono=(x,y,s,txt,o={})=>`<text x="${f1(x)}" y="${f1(y)}" text-anchor="${o.a||'start'}" style="font:${o.w||500} ${o.sz||27}px GM;letter-spacing:${o.ls??.12}em" fill="${o.c||WH}" opacity="${f3(o.op??1)}">${txt}</text>`;
const mark=(x,y,ok,a,c=WH,w=4.5)=>ok?`<path d="M${x-12} ${y}l9 9l17-19" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${a}"/>`:`<path d="M${x-10} ${y-10}l20 20M${x+10} ${y-10}l-20 20" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${a}"/>`;
// le flyer : un disque « néon » + un titre ; col = couleur de l'encre/la lumière, glow = halo lumineux de l'écran
function flyer(x,y,w,h,col,glow,a,rot=0){if(a<=0)return '';const cx=x+w/2,cy=y+h*.4,r=w*.3;
 let g=`<g opacity="${f3(a)}" transform="rotate(${rot} ${f1(cx)} ${f1(y+h/2)})">`;
 if(rot)g+=`<rect x="${f1(x+6)}" y="${f1(y+12)}" width="${f1(w)}" height="${f1(h)}" rx="4" fill="${MER}" opacity=".35"/>`;
 g+=`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="4" fill="${WH}"/>`;
 if(glow>0)g+=`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r*1.75)}" fill="url(#glw)" opacity="${f3(glow)}"/>`;
 g+=`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${col}"/>`;
 g+=`<text x="${f1(cx)}" y="${f1(y+h*.84)}" text-anchor="middle" style="font:800 ${f1(w*.25)}px BG;font-stretch:78%;letter-spacing:-.01em" fill="${col}">NÉON</text>`;
 g+=`<rect x="${f1(cx-w*.26)}" y="${f1(y+h*.885)}" width="${f1(w*.52)}" height="${f1(h*.022)}" rx="2" fill="${col}" opacity=".45"/>`;
 return g+'</g>';}
// trois disques qui se superposent ; L = couleurs des zones couvertes 1, 2, 3 fois
function venn(C,r,L,labs,la){const [A,B,Cc]=C;let g=`<defs>${C.map((p,i)=>`<clipPath id="v${i}"><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}"/></clipPath>`).join('')}</defs>`;
 const c=(p,f,cp)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${f}"${cp!=null?` clip-path="url(#v${cp})"`:''}/>`;
 g+=c(A,L[0])+c(B,L[0])+c(Cc,L[0]);
 g+=c(B,L[1],0)+c(Cc,L[1],1)+c(A,L[1],2);
 g+=`<g clip-path="url(#v0)">${c(Cc,L[2],1)}</g>`;
 // étiquettes dans la partie non couverte de chaque disque
 const m=[(A[0]+B[0]+Cc[0])/3,(A[1]+B[1]+Cc[1])/3];
 C.forEach((p,i)=>{const dx=p[0]-m[0],dy=p[1]-m[1],d=Math.hypot(dx,dy),q=d<1?0:r*.45/d;
  labs[i].forEach(([txt,col,op])=>{if(op>0)g+=`<text x="${f1(p[0]+dx*q)}" y="${f1(p[1]+dy*q+15)}" text-anchor="middle" style="font:600 44px GM" fill="${col}" opacity="${f3(op*la)}">${txt}</text>`;});});
 return g;}
// ---------- état de Point ----------
const PT0=[540,1172],PS=.46;
function pointAt(t){const br=Math.sin(t*2.1)*.012;let e='neutre',look=[-.9,-.7],o={};
 if(t<T.oh){e='neutre';look=[-1,-.6];}
 else if(t<T.pfff){e='surpris';look=[1,-.5];o.glyph='!';o.glyphK=1-sine(P(t,1.45,.35));o.sq=-.05*Math.sin(Math.PI*cl(P(t,T.oh,.25)));}
 else if(t<T.s1+.3){e='ennuye';look=[1,0];o.arm=.5*Math.sin(Math.PI*cl(P(t,T.pfff,1.2)));}
 else if(t<T.hm){e='neutre';look=[0,-1];}
 else if(t<T.flip){e='concentre';look=[0,-1];}
 else if(t<T.clamp){e='neutre';look=[-.2,-1];}
 else if(t<T.s4){e=t<T.pfff2?'surpris':'ennuye';look=[-.4,-.9];}
 else if(t<T.proofE){e='neutre';look=t<T.mode+.6?[-1,-.6]:(t<T.proof?[1,-.5]:[-1,-.6]);}
 else {e=t<T.end-.25?'content':'neutre';look=[0,-.6];o.sq=.08*Math.sin(Math.PI*cl(P(t,T.tadam,.3)));o.arm=1.4*Math.sin(Math.PI*cl(P(t,T.tadam,.9)));}

// ---------- l'écran : il grandit en panneau d'explication puis redevient l'écran ----------
const SCR={x:150,y:680,w:440,h:290},PAN={x:148,y:672,w:784,h:400};
function stage(t,A){const k1=io(P(t,T.s1-.05,.9)),k2=io(P(t,T.back,T.backE-T.back)),k=k1*(1-k2);
 const R={x:lerp(SCR.x,PAN.x,k),y:lerp(SCR.y,PAN.y,k),w:lerp(SCR.w,PAN.w,k),h:lerp(SCR.h,PAN.h,k)};
 const dx=3*Math.sin(2*Math.PI*t/9),dy=4*Math.sin(2*Math.PI*t/7);R.x+=dx;R.y+=dy;

  <clipPath id="scr"><rect x="${f1(R.x)}" y="${f1(R.y)}" width="${f1(R.w)}" height="${f1(R.h)}" rx="${f1(lerp(6,18,k))}"/></clipPath></defs>`;
 g+=`<g opacity="${f3(A)}">`;
 // moniteur : cadre + pied (disparaît quand l'écran devient panneau)
 const bz=1-k;
 if(bz>0){const mx=R.x+R.w/2,by=R.y+R.h;
  g+=`<g opacity="${f3(bz)}"><ellipse cx="${f1(mx)}" cy="${f1(by+92)}" rx="150" ry="16" fill="${MER}" opacity=".35"/><rect x="${f1(R.x-12)}" y="${f1(R.y-12)}" width="${f1(R.w+24)}" height="${f1(R.h+24)}" rx="18" fill="${MER}" stroke="${WH}" stroke-width="5"/>
  <path d="M${f1(mx-26)} ${f1(by+12)}L${f1(mx-34)} ${f1(by+78)}H${f1(mx+34)}L${f1(mx+26)} ${f1(by+12)}" fill="${MER}" stroke="${WH}" stroke-width="5" stroke-linejoin="round"/><path d="M${f1(mx-90)} ${f1(by+82)}H${f1(mx+90)}" stroke="${WH}" stroke-width="7" stroke-linecap="round"/></g>`;}
 if(k>0)g+=`<rect x="${f1(R.x)}" y="${f1(R.y+16)}" width="${f1(R.w)}" height="${f1(R.h)}" rx="18" fill="${MER}" opacity="${f3(.35*k)}"/>`;
 // contenu de l'écran

  g+=mono(R.x+16,R.y+29,1,'RVB',{sz:25,op:1-md,ls:.06,w:600})+mono(R.x+16,R.y+29,1,'CMJN',{sz:25,op:md,ls:.06,w:600});
